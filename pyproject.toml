[project]
name = "mwalimukit-api"
version = "0.1.0"
description = "MwalimuKit backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "argon2-cffi>=21.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=1.30",
    "anthropic>=0.25",
    "structlog>=24.1",
    "email-validator>=2.1",
    "reportlab>=4.0",
    "python-docx>=1.0",
    "stripe>=7.0",
    "    sentry-sdk>=2.0",
    "dramatiq[redis]>=1.14",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.4",
]
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[tool.ruff]
line-length = 100
target-version = "py311"
ignore = ["B008"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
