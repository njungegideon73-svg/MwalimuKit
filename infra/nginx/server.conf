# ─────────────────────────────────────────────────────────────
# nginx reverse-proxy + load-balancer template for production
# ─────────────────────────────────────────────────────────────
# This file is the source template (no envsubst needed) used when
# nginx runs as a reverse proxy in front of the API and Web
# services inside Docker Compose.
#
# The API is load-balanced with multiple workers.  A separate
# nginx (or a managed load balancer in cloud deployments) should
# sit in front of this for TLS termination — see
# infra/nginx/nginx.conf for the production LB config.
# ─────────────────────────────────────────────────────────────
upstream mwalimukit_api {
    server api:8000;
    keepalive 32;
}

upstream mwalimukit_web {
    server web:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # ── Health / readiness (no auth, no caching) ──────────
    location = /health {
        proxy_pass http://mwalimukit_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Prometheus / metrics ───────────────────────────────
    location = /metrics {
        proxy_pass http://mwalimukit_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── API (load-balanced) ───────────────────────────────
    location /api/ {
        proxy_pass http://mwalimukit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # ── Static web app (SPA fallback) ───────────────────────
    location / {
        proxy_pass http://mwalimukit_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
