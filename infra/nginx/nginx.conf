# ─────────────────────────────────────────────────────────────
# Production nginx load-balancer configuration
# ─────────────────────────────────────────────────────────────
# This config is used by the ``nginx-lb`` service in
# ``infra/docker-compose.prod.yml`` (or a managed LB / ingress
# controller in cloud deployments).
#
# It terminates TLS (with certbot-managed certificates) and
# distributes traffic across multiple API worker containers.
# ─────────────────────────────────────────────────────────────

upstream mwalimukit_api_upstream {
    # Multiple API workers for horizontal scaling.
    # Use least_conn for even distribution under variable latency.
    least_conn;
    server api:8000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream mwalimukit_web_upstream {
    server web:80;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name ${DOMAIN};

    # ── TLS ───────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security headers ──────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Rate limiting (per-IP) ───────────────────────────
    # 100 requests/minute burst 200, 50 req/s for API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/m;

    # ── Health & metrics (bypass rate limit) ─────────────
    location = /health {
        proxy_pass http://mwalimukit_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_bypass $http_pragma;
        proxy_no_cache 1;
        access_log off;
    }

    location = /ready {
        proxy_pass http://mwalimukit_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_bypass $http_pragma;
        proxy_no_cache 1;
        access_log off;
    }

    location = /metrics {
        proxy_pass http://mwalimukit_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_bypass $http_pragma;
        proxy_no_cache 1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        access_log off;
    }

    # ── API (rate-limited) ───────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=200 nodelay;
        proxy_pass http://mwalimukit_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # ── Static assets (cached at edge) ───────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        limit_req zone=general_limit burst=100 nodelay;
        proxy_pass http://mwalimukit_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache static_cache;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Service worker (no cache) ────────────────────────
    location = /sw.js {
        proxy_pass http://mwalimukit_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log off;
    }

    # ── PWA / SPA fallback ───────────────────────────────
    location / {
        limit_req zone=general_limit burst=100 nodelay;
        proxy_pass http://mwalimukit_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Cache zone for static assets
proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:100m max_size=2g inactive=60d use_temp_path=off;
