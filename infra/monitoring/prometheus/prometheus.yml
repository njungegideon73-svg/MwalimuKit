# ─────────────────────────────────────────────────────────────
# Prometheus configuration for MwalimuKit
# ─────────────────────────────────────────────────────────────
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ── API service (exposes /metrics in Prometheus text format)
  - job_name: "mwalimukit-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "api:8000"
        replacement: "mwalimukit-api"

  # ── PostgreSQL (requires postgres_exporter)
  - job_name: "mwalimukit-postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metrics_path: "/metrics"
    scrape_interval: 30s
    honor_labels: true

  # ── Redis (requires redis_exporter)
  - job_name: "mwalimukit-redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    metrics_path: "/scrape"
    params:
      target: ["redis://redis:6379"]
    scrape_interval: 30s

  # ── Nginx (requires nginx-prometheus-exporter)
  - job_name: "mwalimukit-nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
    scrape_interval: 30s

  # ── Node / host metrics
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 30s
