# ─────────────────────────────────────────────────────────────
# Alertmanager configuration
# ─────────────────────────────────────────────────────────────
# Routes alerts to Slack and email.  Replace webhook URLs and
# email addresses with your real targets.
# ─────────────────────────────────────────────────────────────
global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.sendgrid.net:587"
  smtp_from: "alerts@mwalimukit.co.ke"
  slack_api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

  routes:
    # Critical alerts → Slack #oncall + email
    - match:
        severity: critical
      receiver: slack-critical
      routes:
        - receiver: email-critical
          continue: true

    # Warnings → Slack #alerts only
    - match:
        severity: warning
      receiver: slack-warning

  receiver: slack-warning

receivers:
  - name: slack-critical
    slack_configs:
      - channel: "#oncall"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}"
        color: "danger"

  - name: slack-warning
    slack_configs:
      - channel: "#alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}"
        color: "warning"

  - name: email-critical
    email_configs:
      - to: "ops@mwalimukit.co.ke"
        send_resolved: true
        html: "{{ .CommonAnnotations.description }}"
