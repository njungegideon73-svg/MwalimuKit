# ─────────────────────────────────────────────────────────────
# MwalimuKit — Monitoring & Alerting (Prometheus + Grafana)
# ─────────────────────────────────────────────────────────────
# Local monitoring stack: run alongside docker-compose.yml
#
#   docker compose -f infra/docker-compose.yml \
#     -f infra/monitoring/docker-compose.monitoring.yml up -d
#
# Prometheus: http://localhost:9090
# Grafana:     http://localhost:3001  (admin / admin)
# ─────────────────────────────────────────────────────────────
services:
  prometheus:
    image: prom/prometheus:v2.53
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    depends_on:
      - api

  grafana:
    image: grafana/grafana-enterprise:11.1
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
