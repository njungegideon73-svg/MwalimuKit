# ─────────────────────────────────────────────────────────────
# MwalimuKit — Production Docker Compose
# ─────────────────────────────────────────────────────────────
# Spins up a full production stack locally or on a single VM:
#   - nginx (reverse proxy + load balancer) on :80/:443
#   - N API workers (gunicorn + uvicorn workers)
#   - Web (nginx-served static build)
#   - PostgreSQL (single-instance; use a managed DB in real prod)
#   - Redis (cache + rate limiting)
#   - db-backup (nightly on profile "backup")
#
# Usage:
#   cp .env.example .env        # fill in production secrets
#   API_WORKERS=4 docker compose -f infra/docker-compose.yml \
#       -f infra/docker-compose.prod.yml up --build -d
#   docker compose -f infra/docker-compose.yml \
#       -f infra/docker-compose.prod.yml exec api alembic upgrade head
# ─────────────────────────────────────────────────────────────
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/server.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certbot_conf:/etc/letsencrypt
      - nginx_certbot_www:/var/www/certbot
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      DOMAIN: ${DOMAIN:-mwalimukit.co.ke}

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mwalimu:${POSTGRES_PASSWORD:-changeme}@db:5432/mwalimukit
      REDIS_URL: redis://redis:6379/0
      API_WORKERS: ${API_WORKERS:-4}
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.seed_curriculum &&
             gunicorn -k uvicorn.workers.UvicornWorker -w ${API_WORKERS:-4} -b 0.0.0.0:8000 app.main:app"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${FRONTEND_URL:-http://localhost}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mwalimu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: mwalimukit
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mwalimu -d mwalimukit"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: mwalimu
      PGDATABASE: mwalimukit
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
    volumes:
      - db_backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "[db-backup] running every $${BACKUP_INTERVAL_SECONDS}s, retaining $${RETENTION_DAYS} days"
        while true; do
          STAMP=$$(date -u +%Y%m%dT%H%M%SZ)
          OUT=/backups/mwalimukit-$$STAMP.dump
          if pg_dump -Fc -f "$$OUT" && [ "$$(wc -c < $$OUT)" -gt 1024 ]; then
            gzip -f "$$OUT"
            echo "[db-backup] wrote $${OUT}.gz"
          else
            echo "[db-backup] dump failed" >&2
            rm -f "$$OUT"
          fi
          find /backups -name 'mwalimukit-*.dump.gz' -mtime +"$$RETENTION_DAYS" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done

volumes:
  db_data:
  redis_data:
  db_backups:
  nginx_certbot_conf:
  nginx_certbot_www:
  nginx_cache:
