# ─────────────────────────────────────────────────────────────
# Fly.io production configuration for the MwalimuKit API
# ─────────────────────────────────────────────────────────────
# Copy to infra/fly.toml and adjust:
#   - app name
#   - primary_region
#   - env secrets (set via `fly secrets set`)
#
# Secrets to set (never commit):
#   API_SECRET_KEY, POSTGRES_PASSWORD, DATABASE_URL,
#   REDIS_URL, OPENAI_API_KEY, STRIPE_SECRET_KEY,
#   STRIPE_WEBHOOK_SECRET, SENTRY_DSN
# ─────────────────────────────────────────────────────────────
app = "mwalimukit-api"
primary_region = "jnb"

[build]
  dockerfile = "api/Dockerfile"

[deploy]
  # Run migrations before each release phase
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 5

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/ready"
    protocol = "http"
    tolerance = 2

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024

[env]
  API_ENV = "production"
  API_PORT = "8000"

# ── Autoscaling ─────────────────────────────────────────────
# Scale up when CPU > 70% or connections > 80 for 60s,
# scale down when both drop below 40% / 30 for 5 minutes.
[[services.http_checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"

# ── Cron for nightly backup ─────────────────────────────────
# Uses flyctl to run a one-off machine that dumps the DB to S3.
# See scripts/backup.sh for the local-compose equivalent.
