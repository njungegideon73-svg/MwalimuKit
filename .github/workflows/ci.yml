name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"
      - name: Run ruff linter
        run: ruff check .
      - name: Run ruff formatter check
        run: ruff format --check .

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mwalimu
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: mwalimukit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mwalimu -d mwalimukit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://mwalimu:testpass123@localhost:5432/mwalimukit_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -n auto --cov=app --cov-report=xml --cov-report=term-missing

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --coverage

  build:
    needs: [lint-backend, test-backend, lint-frontend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t mwalimukit-api:sha-${{ github.sha }} -f api/Dockerfile api
      - name: Build Web image
        run: docker build -t mwalimukit-web:sha-${{ github.sha }} -f web/Dockerfile web
