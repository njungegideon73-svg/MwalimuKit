name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── API (Python backend) ────────────────────────────────────────────────
  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mwalimu
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: mwalimukit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mwalimu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync
      - name: Run ruff (lint)
        run: ruff check .
      - name: Run ruff (format check)
        run: ruff format --check .
      - name: Run mypy (type check)
        continue-on-error: true
        run: |
          pip install mypy
          mypy app --ignore-missing-imports || true
      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://mwalimu:changeme@localhost:5432/mwalimukit
          REDIS_URL: redis://localhost:6379/0
          API_SECRET_KEY: "test-secret-key-for-ci-minimum-32-chars!!"
        run: |
          alembic upgrade head || true
          pytest -x -q --tb=short

  # ── Frontend (React web app) ────────────────────────────────────────────
  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript type check
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test -- --run

  # ── Trivy vulnerability scanning ────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    needs: [api-test, web-test]
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy on Python dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "api"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
      - name: Run Trivy on Docker images (if built)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: "ghcr.io/mwalimukit/mwalimukit-api:latest"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
        continue-on-error: true  # image may not exist on all branches

  # ── Build & push (on merge to main) ─────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: [api-test, web-test, security-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mwalimukit/mwalimukit-api,ghcr.io/mwalimukit/mwalimukit-web
          tags: type=sha,type=ref,event=branch
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ghcr.io/mwalimukit/mwalimukit-api:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ghcr.io/mwalimukit/mwalimukit-web:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
